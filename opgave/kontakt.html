<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>
    <nav>
        <a href="https://www.fiktiveside1.dk">side1</a>

    </nav>
    <main>
        <div class="form_wrapper" id="kontakt">
            <h2 class="form_title upper">Kontakt</h2>
            <form action="#" id="form" novalidate>

                <input type="text" name="fullname" placeholder="Navn">

                <input type="email" name="email" placeholder="E-mail">

                <textarea placeholder="Skriv din besked her" name="message"></textarea>

                <input type="submit" value="Send" class="upper">
                <div id="errors"></div>

            </form>

        </div>
    </main>
